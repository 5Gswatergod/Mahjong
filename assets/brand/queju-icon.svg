    <filter id="tileShadow" x="-20%" y="-18%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="11" stdDeviation="8" flood-color="#041817" flood-opacity="0.34" />
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="url(#felt)" />
  <path d="M128 66C82 92 54 141 54 196v120c0 55 28 104 74 130" fill="none" stroke="#d64132" stroke-width="18" stroke-linecap="round" opacity="0.9" />
  <path d="M384 66c46 26 74 75 74 130v120c0 55-28 104-74 130" fill="none" stroke="#e5bd66" stroke-width="18" stroke-linecap="round" opacity="0.86" />
