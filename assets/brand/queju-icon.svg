<svg width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">雀局四風合牌圖標</title>
  <desc id="desc">東南西北四張風牌組成的雀局網站圖標。</desc>
  <defs>
    <linearGradient id="felt" x1="88" y1="28" x2="424" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17614f" />
      <stop offset="1" stop-color="#0b302f" />
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7" />
      <stop offset="1" stop-color="#efe2c7" />
